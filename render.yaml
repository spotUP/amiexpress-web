# AmiExpress BBS - Render.com Deployment Configuration
#
# Unified Docker Service - Serves all frontends (BBS, Admin, SDK)
# Cost: 1 service | Build time: 3-5 minutes
#

services:
  - type: web
    name: amiexpress-bbs
    env: docker
    region: oregon
    plan: starter
    autoDeploy: true
    branch: main

    dockerfilePath: ./Dockerfile
    dockerContext: .

    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 3001
      - key: BACKEND_PORT
        value: 3001
      - key: DATABASE_DIR
        value: /app/db
      - key: DATABASE_FILE
        value: amiexpress.db
      - key: BBS_DATA_DIR
        value: /app/data/bbs
      - key: ROM_DIR
        value: /app/data/amiga-roms
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: DEBUG
        value: false
      - key: XIM_DEBUG
        value: 0

    disk:
      name: bbs-data
      mountPath: /app/db
      sizeGB: 10

    healthCheckPath: /

    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
