services:
  # AmiExpress BBS - Docker Deployment
  # Simplified deployment using production-ready Docker image
  - type: web
    name: amiexpress-bbs
    env: docker
    region: oregon
    plan: starter
    autoDeploy: true
    branch: main

    # Docker configuration
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # Environment variables
    envVars:
      - key: NODE_ENV
        value: production

      - key: HOST
        value: 0.0.0.0

      - key: PORT
        value: 3001

      - key: BACKEND_PORT
        value: 3001

      # Database configuration
      - key: DATABASE_DIR
        value: /app/db

      - key: DATABASE_FILE
        value: amiexpress.db

      # BBS data directory
      - key: BBS_DATA_DIR
        value: /app/data/bbs

      # ROM directory (for Amiga 68K doors)
      - key: ROM_DIR
        value: /app/data/amiga-roms

      # Security (auto-generated)
      - key: JWT_SECRET
        generateValue: true

      - key: JWT_REFRESH_SECRET
        generateValue: true

      - key: SESSION_SECRET
        generateValue: true

      # Optional: Debug logging
      - key: DEBUG
        value: false

      - key: XIM_DEBUG
        value: 0

    # Persistent disk for SQLite database and BBS data
    disk:
      name: bbs-data
      mountPath: /app/db
      sizeGB: 10

    # Health check
    healthCheckPath: /

    # Custom headers for WebSocket support
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

