# AmiExpress BBS - Render.com Deployment Configuration
#
# Unified Docker Service - Serves all frontends (BBS, Admin, SDK)
# Cost: 1 service | Build time: 3-5 minutes
#
# IMPORTANT: BBS data is stored on persistent disk at /app/data
# Deployments do NOT overwrite user data (messages, uploads, users)
# Only code/frontend changes are deployed
#

services:
  - type: web
    name: amiexpress-bbs
    env: docker
    region: oregon
    plan: starter
    autoDeploy: false
    branch: main

    dockerfilePath: ./Dockerfile
    dockerContext: .

    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 3001
      - key: BACKEND_PORT
        value: 3001
      - key: DATABASE_DIR
        value: /app/data/db
      - key: DATABASE_FILE
        value: amiexpress.db
      - key: BBS_DATA_DIR
        value: /app/data/bbs
      - key: ROM_DIR
        value: /app/data/amiga-roms
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: DEBUG
        value: false
      - key: XIM_DEBUG
        value: 0
      - key: CORS_ORIGINS
        value: https://bbs.uprough.net,https://amiexpress-bbs-x0hv.onrender.com
      # Set to 1 to force re-copy Screens from default-data (fixes empty placeholders)
      # After deploy completes, set back to 0
      - key: FORCE_REINIT_SCREENS
        value: 0
      # Set to 1 to force re-copy AROS ROM files (fixes missing 68K emulation)
      # After deploy completes, set back to 0
      - key: FORCE_REINIT_ROMS
        value: 1
      # Set to 1 to force re-copy .info config files (ConfConfig.info, bbsConfig.info, Conf*.info)
      # After deploy completes, set back to 0
      - key: FORCE_REINIT_CONFIG
        value: 1

    # Persistent disk for ALL BBS data (database, users, messages, files)
    # This data survives deployments and is NOT overwritten
    disk:
      name: bbs-data
      mountPath: /app/data
      sizeGB: 10

    healthCheckPath: /
