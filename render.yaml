services:
  # Frontend - Static Site
  - type: web
    name: amiexpress-frontend
    env: static
    buildCommand: cd web/frontend && npm ci --include=dev && npm run build
    staticPublishPath: ./web/frontend/dist
    autoDeploy: true
    branch: main

  # Backend - Web Service (Unified Deployment - serves all frontends)
  - type: web
    name: amiexpress-backend
    env: node
    region: oregon
    plan: starter
    autoDeploy: true
    branch: main
    buildCommand: |
      # Build SDK
      cd sdk && npm ci --include=dev && npm run build && cd ..
      # Build SDK Preview Frontend
      cd sdk/tools/preview/frontend && npm ci --include=dev && npm run build && cd ../../../..
      # Build frontend
      cd web/frontend && npm ci --include=dev && npm run build && cd ../..
      # Build config-app
      cd web/config-app && npm ci --include=dev && npm run build && cd ../..
      # Build backend (and install deps)
      cd web/backend && npm ci
    startCommand: cd web/backend && npx tsx src/index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_DIR
        value: /opt/render/project/src/web/backend/data
      - key: DATABASE_FILE
        value: amiexpress.db
      - key: BBS_DATA_DIR
        value: /opt/render/project/src
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
    
    # Disk for SQLite database persistence
    disk:
      name: sqlite-data
      mountPath: /opt/render/project/src/web/backend/data
      sizeGB: 10

    # Health check endpoint
    healthCheckPath: /health