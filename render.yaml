services:
  # Frontend - Static Site
  - type: web
    name: amiexpress-frontend
    env: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: ./client/dist
    envVars:
      - key: NODE_ENV
        value: production

  # Backend - Web Service
  - type: web
    name: amiexpress-backend
    env: node
    region: oregon
    plan: starter
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_DIR
        value: /opt/render/project/src/backend/data
      - key: DATABASE_FILE
        value: amiexpress.db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
    
    # Disk for SQLite database persistence
    disk:
      name: sqlite-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1

    # Health check endpoint
    healthCheckPath: /health