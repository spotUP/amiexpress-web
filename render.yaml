services:
  # Frontend - Static Site
  - type: web
    name: amiexpress-frontend
    env: static
    buildCommand: cd web/frontend && npm ci --include=dev && npm run build
    staticPublishPath: ./web/frontend/dist

  # Backend - Web Service
  - type: web
    name: amiexpress-backend
    env: node
    region: oregon
    plan: starter
    buildCommand: cd web/backend && npm ci
    startCommand: cd web/backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_DIR
        value: /opt/render/project/src/web/backend/data
      - key: DATABASE_FILE
        value: amiexpress.db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
    
    # Disk for SQLite database persistence
    disk:
      name: sqlite-data
      mountPath: /opt/render/project/src/web/backend/data
      sizeGB: 10

    # Health check endpoint
    healthCheckPath: /health