# DoorRepo configuration for this BBS.
# Paths use AmigaDOS assigns as the emulator resolves them:
#   PROGDIR: -> this door directory, Doors: -> the BBS Doors tree,
#   BBS:     -> the BBS root (so BBS:Commands/BBSCmd is the command dir).
# Without this file the door would default to DownloadDir=T:, which here is
# a throwaway /tmp path, and to relative Doors//BBSCmd/ which would resolve
# INSIDE this door directory rather than at the BBS root.

RepoHost=bbs.uprough.net
RepoPort=80
RepoPath=/api/door-repo

DownloadDir=PROGDIR:downloads/
DoorsDir=Doors:
BBSCmdDir=BBS:Commands/BBSCmd/
LogFile=PROGDIR:DoorRepo.log

LhaCommand=LhA
ExtractAfterDownload=no

Ansi=yes
ScreenRows=24
ScreenCols=80

# TEMPORARY, for the -D-CALC.LHA / -J-LCV30.LHA checksum investigation.
# Keeps a download whose digest did not match as <name>.bad instead of
# deleting it, so the actual bytes can be compared against what the server
# sent. Set here rather than only on the live box because a deploy rewrites
# this file from the repo - enabling it in the container alone means the
# next deploy quietly disarms it, which is how the first occurrence was
# lost. Remove once the corruption is explained.
KeepFailedDownloads=yes
