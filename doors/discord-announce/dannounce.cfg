# Discord Announce Configuration
# Get your webhook URL from Discord Server Settings > Integrations > Webhooks

# REQUIRED: Discord webhook URL
# Example: https://discord.com/api/webhooks/123456789/ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefgh
webhookurl=YOUR_DISCORD_WEBHOOK_URL_HERE

# Enable/disable Discord announcements (YES/NO/1/0/TRUE/FALSE)
enabled=YES

# Optional: Bot name to display in Discord (default: "/X Announce Bot")
# botname=Your BBS Name Bot

# Optional: Avatar URL for the bot (leave blank for default Discord avatar)
# avatarurl=https://your-server.com/bot-avatar.png

# Instructions:
# 1. Create a Discord webhook URL from your Discord server
# 2. Replace YOUR_DISCORD_WEBHOOK_URL_HERE with your actual webhook URL
# 3. Remove the comment (#) from the webhookurl line
# 4. Optionally customize botname and avatarurl
# 5. Save this file and restart your BBS

# This door announces user logins/logoffs to your Discord channel
# It can be run from login/logout scripts or called directly as a door command