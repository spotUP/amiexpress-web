# Global Last Callers Viewer Configuration
# Displays last callers from scenewall.bbs.io

# Server settings
serverhost=scenewall.bbs.io
serverport=1541
timeout=10
retries=5

# Display settings
lines=10
screenclear=NO
# Style: 1-4 (can use comma-separated for random: 1,2,3,4)
style=1
centrename=0

# Optional: Timezone (e.g., "Europe/Stockholm")
timezone=

# Optional: View specific BBS only
viewbbs=
