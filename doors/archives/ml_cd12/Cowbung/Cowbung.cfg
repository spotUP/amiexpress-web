                   COWABUNGA DELETER CONFIGURATION NOTES
                   =-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=-=


NOTE: This config feature is recommended for advanced sysops only. You
should experiment with the gadgets and their requesters first and get a
feeling for the program. Once you know what options you want and what they
mean, come back to this file and configure it.

1.  This path is for the MOVE DESCRIPTIONS option. You have 80 characters
(delete comments if you wish).  If a file is successfully deleted, and the
MOVE flag is activated, its description will be deleted and appended
elsewhere.  You can specify the destination in this line.  Note, if you
are deleting more than one directory at a time (there is no limit), then
all descriptions will be appended to this same destination.  Use this sort
of like a global PURGE or OFFLINE dir.

2.  This sets the full name (with path) of where you want all the important
info pertaining to Cowabunga Deleter's activities to be stored.  All errors
encountered are written to this file. A chronological order is kept and
every new process is separated and dated. An invalid path/name will default
to "ram:cowbung.log".


3. This word replaces the bytes in your directory listing. For example:

AEXPR_1.DMS  P 390361  12-10-92  Art Expression Disk 1/4.
becomes:
AEXPR_1.DMS  P DELETED 12-10-92  Art Expression Disk 1/4.

This feature is only apparent if you set flag #6 with a "Y" and only if
the file was deleted.  If an error ocurred (i.e file not found in paths),
then the description will not be altered.


4. Here you set the character to be used as a marker. I recommend using the
"@" symbol. By preceding a filename with the marker (within the DIR list),
the file will be deleted if flag #9 is set, otherwise the marker is
ignored. For example:

@AEXPR_1.DMS  P 390361  12-10-92  Art Expression Disk 1/4,

would be considered a marked file.  This feature is only available if
flag#9 has been set.


5. If you wish to keep a log of all activities, set this flag to "Y".
I do not recommend setting it to "N", since all error reports are dumped to
the log.  Without a log, you won't be aware of errors incurred during a
Cowabunga Deleter session.  The log's name is in line #2.


6. This sets the overwrite file size flag. See line #3 for an example.


7. This sets the move files flag. If you wish to move the descriptions of
deleted files to another file, set this to "Y". See line #1 for more info.


8.  Kill descriptions.  Like the line says, if this flag is set, then the
descriptions of matched and deleted files will be deleted as well. This
can come in handy if you like to keep tight and clean dirs.

9. If set, then files will be matched if they have a preceeding symbol or
marker. See line #4 for more info.

10.  Check date range.  If this flag is set, then the values stored in the
gadgets TO and FROM are used as reference points.  If a date falls between
or including those two dates, then the file is deleted.  At this time, you
cannot configure the TO and FROM dates from within this file; they have to
be manually entered via the gadgets.


11.  Keyword match:  perhaps the most powerful option of CD.  It let's you
match a file via description contents.  That's right, if you want to get
rid of all your DEMOS and PREVIEWS, use this option.  This can also be
used to wipe out wares uploaded by a certain lamer.  Neat, huh?  You can
enter up to 900 characters in line #13, plenty of room for about 150 keys.
More than enough I'd say.  Be sure to separate each key with a comma or
space or both.  Keyword case is not important (all descriptions are
convereted to uppercase, along with the keys).


12. The CD banner is just a simple 2 line comment that is appended to the
directory in question. It just says that CD was activated on XX-XX-XX
date, and how many files and bytes were zapped. If you like this tool, and
find it useful, please leave this banner in. I program for fun, but a
little fame once in a while doesn't hurt.  Note:  If you are running some
tests on CD, disable this function, otherwise you will clutter up your DIR
with a bunch of CD banners.


13. The keys that are going to be matched in the file descriptions of each
file.  Separate them with a space, comma, or both.  You have 900
characters, roughly 150+ keys.  Be careful with the keys you use, they may
match more files than you are aware of!

14. This is just a comment, don't delete it!

15.  From here on, you can add as many conference DIR listings as you
want (well, almost, there is a limit of 100). Separate each entry with a
space, tab, or line-feed (whitespace). If an entry exceeds 80 characters,
it will be ignored.


