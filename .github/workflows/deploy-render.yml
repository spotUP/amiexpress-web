name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Render deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "[WARNING] RENDER_API_KEY not set, skipping deployment"
            echo "To enable auto-deploy:"
            echo "1. Get your Render API key from https://dashboard.render.com/account/api-keys"
            echo "2. Get your service ID from your Render service URL"
            echo "3. Add RENDER_API_KEY and RENDER_SERVICE_ID to GitHub Secrets"
            exit 0
          fi

          if [ -z "$RENDER_SERVICE_ID" ]; then
            echo "[WARNING] RENDER_SERVICE_ID not set, skipping deployment"
            echo "Service ID format: srv-xxxxxxxxxxxxx"
            exit 0
          fi

          echo "[OK] Triggering Render deployment for service: $RENDER_SERVICE_ID"

          # Trigger Render deployment via API
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}')

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n-1)

          if [ "$http_code" -eq 201 ]; then
            echo "[OK] Deployment triggered successfully"
            echo "$body" | jq -r '.id' | xargs -I {} echo "Deploy ID: {}"
            echo "Monitor deployment: https://dashboard.render.com/web/$RENDER_SERVICE_ID"
          else
            echo "[ERROR] Deployment failed with HTTP $http_code"
            echo "$body"
            exit 1
          fi

      - name: Report success
        if: success()
        run: echo "[OK] Deployment workflow completed"

      - name: Report failure
        if: failure()
        run: echo "[ERROR] Deployment workflow failed"
