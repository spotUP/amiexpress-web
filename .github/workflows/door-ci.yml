name: Door CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  door-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install deps
        run: npm install
      - name: Run door CI (doctor + harness)
        run: npm run door:ci
        env:
          DOCTOR_RUN: 1
          DOCTOR_COMPILE_PY: 1
