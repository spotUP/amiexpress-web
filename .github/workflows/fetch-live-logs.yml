name: Fetch Live Logs

# Manual-dispatch workflow for grabbing live BBS logs (backend / xim /
# preview / arbitrary path under /app/data/logs). Output is streamed
# into the workflow log itself — fetch with:
#
#   gh run watch <run-id> --exit-status   # while it runs
#   gh run view <run-id> --log            # after it completes
#
# Usage:
#   gh workflow run fetch-live-logs.yml \
#     -f log=backend -f tail=1000 -f grep="FR|flagPause|Pause"

on:
  workflow_dispatch:
    inputs:
      log:
        description: 'backend / preview / xim / all-recent / <relative path>'
        required: false
        default: 'backend'
      tail:
        description: 'Number of trailing lines'
        required: false
        default: '1000'
      grep:
        description: 'Optional grep -E pattern'
        required: false
        default: ''

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: SSH + dump logs to workflow stdout
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            LOG_INPUT='${{ inputs.log }}'
            TAIL_INPUT='${{ inputs.tail }}'
            GREP_INPUT='${{ inputs.grep }}'

            CID=$(docker ps --filter "name=amiexpress-bbs" --format '{{.ID}}' | head -1)
            if [ -z "$CID" ]; then
              echo "ERROR: no amiexpress-bbs container running"
              exit 1
            fi
            echo "================================================="
            echo "Container: $CID"
            echo "Started:   $(docker inspect --format '{{.State.StartedAt}}' "$CID")"
            echo "Live HEAD: $(docker exec "$CID" sh -lc 'git -C /app rev-parse HEAD 2>/dev/null || echo unknown')"
            echo "================================================="

            # Probe both common log dirs — the dev script writes to
            # ./logs (project-root-relative), but in the container that
            # resolves to /app/logs OR /app/web/backend/logs depending
            # on cwd.
            LOGS_DIR=""
            for candidate in /app/logs /app/web/backend/logs /app/data/logs; do
              if docker exec "$CID" test -d "$candidate" 2>/dev/null; then
                LOGS_DIR="$candidate"
                break
              fi
            done
            if [ -z "$LOGS_DIR" ]; then
              echo "ERROR: no logs dir found in container"
              docker exec "$CID" find /app -maxdepth 3 -name 'backend.log' 2>/dev/null
              exit 1
            fi
            echo "Resolved logs dir: $LOGS_DIR"

            case "$LOG_INPUT" in
              backend) FILE="$LOGS_DIR/backend.log" ;;
              preview) FILE="$LOGS_DIR/preview.log" ;;
              xim)     FILE="$LOGS_DIR/xim-debug.log" ;;
              all-recent)
                echo "== $LOGS_DIR (top 20 newest) =="
                docker exec "$CID" ls -lt "$LOGS_DIR" 2>/dev/null | head -20 || true
                echo ""
                FILE="$LOGS_DIR/backend.log"
                ;;
              doors)
                echo "== AquaScan binary on live =="
                docker exec "$CID" sh -lc 'find /app /app/data -maxdepth 6 -name "AquaScan*" 2>/dev/null' || true
                echo ""
                echo "== Doors dir top-level =="
                docker exec "$CID" sh -lc 'ls -la /app/data/bbs/Doors 2>/dev/null; echo "---"; ls -la /app/Doors 2>/dev/null' || true
                FILE="$LOGS_DIR/backend.log"
                ;;
              confs)
                echo "== ConfConfig.info strings on live =="
                docker exec "$CID" sh -lc 'find /app -maxdepth 4 -iname "ConfConfig.info" 2>/dev/null | head -5' || true
                echo "---"
                docker exec "$CID" sh -lc 'for f in /app/data/bbs/ConfConfig.info /app/ConfConfig.info /app/default-data/ConfConfig.info; do echo "==== $f ===="; strings "$f" 2>/dev/null | head -50; done' || true
                FILE="$LOGS_DIR/backend.log"
                ;;
              userdata)
                echo "== sqlite3 db locations =="
                docker exec "$CID" sh -lc 'find /app -maxdepth 4 -name "*.db" 2>/dev/null' || true
                echo ""
                echo "== users table dump =="
                docker exec "$CID" sh -lc 'for db in /app/data/bbs/amiexpress.db /app/data/amiexpress.db /app/web/backend/amiexpress.db; do if [ -f "$db" ]; then echo "==== $db ===="; sqlite3 "$db" "SELECT username,seclevel,length(confaccess) AS lc, confaccess, securityflags FROM users LIMIT 10;" 2>/dev/null; fi; done' || true
                echo ""
                echo "== user.data files (capital vs lowercase) sizes =="
                docker exec "$CID" sh -lc 'ls -la /app/data/bbs/user.data /app/data/bbs/User.data 2>&1' || true
                echo ""
                echo "== md5sums =="
                docker exec "$CID" sh -lc 'md5sum /app/data/bbs/user.data /app/data/bbs/User.data 2>&1' || true
                echo ""
                echo "== hex dump confaccess area (offsets 119..148 in record 1 — 29 bytes) =="
                docker exec "$CID" sh -lc 'for f in /app/data/bbs/user.data /app/data/bbs/User.data; do if [ -f "$f" ]; then echo "==== $f record 1 ===="; xxd -s 119 -l 29 "$f" 2>/dev/null; echo "==== $f record 2 ===="; xxd -s $((1024+119)) -l 29 "$f" 2>/dev/null; fi; done' || true
                FILE="$LOGS_DIR/backend.log"
                ;;
              *) FILE="$LOGS_DIR/$LOG_INPUT" ;;
            esac

            echo "== $FILE (last $TAIL_INPUT lines${GREP_INPUT:+, grep -E \"$GREP_INPUT\"}) =="
            FILE_BYTES=$(docker exec "$CID" sh -lc "test -f '$FILE' && wc -c < '$FILE' || echo 0" 2>/dev/null)
            echo "(file size: $FILE_BYTES bytes)"
            if [ -n "$GREP_INPUT" ]; then
              docker exec "$CID" tail -n "$TAIL_INPUT" "$FILE" 2>/dev/null \
                | grep -aE "$GREP_INPUT" || echo "(no matches in file)"
            else
              docker exec "$CID" tail -n "$TAIL_INPUT" "$FILE" 2>/dev/null
            fi

            # If the file is small / empty, fall back to docker logs (the
            # container's stdout/stderr — where Node's plain console.log
            # actually lands when the BBS doesn't tee to a file).
            if [ "${FILE_BYTES:-0}" -lt 1024 ]; then
              echo ""
              echo "== file too small / empty, falling back to `docker logs --tail $TAIL_INPUT` =="
              if [ -n "$GREP_INPUT" ]; then
                docker logs --tail "$TAIL_INPUT" "$CID" 2>&1 | grep -aE "$GREP_INPUT" || echo "(no matches in docker logs)"
              else
                docker logs --tail "$TAIL_INPUT" "$CID" 2>&1
              fi
            fi
