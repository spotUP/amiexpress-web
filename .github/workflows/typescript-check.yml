name: TypeScript Type Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  typescript-check:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        package:
          - web/backend
          - web/frontend
          - web/config-app
          - sdk
          - packages/terminal

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: npm ci

      - name: TypeScript type check
        working-directory: ${{ matrix.package }}
        run: npx tsc --noEmit

      - name: Report success
        if: success()
        run: echo "[OK] TypeScript check passed for ${{ matrix.package }}"

      - name: Report failure
        if: failure()
        run: echo "[ERROR] TypeScript errors in ${{ matrix.package }}"
