name: Backend Tests

# Runs the backend jest suite and the type-check on every push and PR.
#
# Why this exists: until now nothing in CI ran jest at all. The one workflow
# named "Door CI" (kept disabled as door-ci.yml.disabled) runs `npm run
# door:ci`, which is the doctor + fixture-door harness, not the test suite.
# So every regression test in web/backend/tests was manual-only - including
# the bsdsocket fd-lifecycle, errno, gethostbyname and non-blocking-connect
# tests, whose entire purpose is to fail loudly if someone reintroduces a bug
# that hangs real Amiga network doors.
#
# The suite is fast (~40-75s for 268 suites / 5090 tests) and passes clean, so
# there is no reason for it not to gate merges.
#
# NOTE: do NOT set SKIP_DB_INIT=1 for a full run. It is meant for targeted
# emulator suites; applied to the whole suite it disables the test database
# that the ~39 database suites need and manufactures ~344 failures.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/backend/package-lock.json

      # Build the SDK with its own pinned TypeScript before the backend
      # install triggers the SDK's prepare hook, exactly as
      # corpus-integration.yml does - see that file for why the version
      # mismatch matters.
      - name: Build SDK
        working-directory: sdk
        run: npm ci --no-audit --no-fund && npm run build

      - name: Install backend deps
        working-directory: web/backend
        env:
          SKIP_WEB_ASSET_BUILD: '1'
          SKIP_SDK_PREPARE: '1'
        run: npm ci --no-audit --no-fund

      # web/backend's test script points jest at a TypeScript config file, and
      # jest needs ts-node to read one - but web/backend declares neither
      # ts-node nor typescript. Both live in the REPO ROOT node_modules, and a
      # developer's checkout works only because node resolution walks up into
      # it. So the root install is not optional tooling here; without it
      # `npm test` fails with "'ts-node' is required for the TypeScript
      # configuration files".
      #
      # --ignore-scripts and SKIP_SDK_PREPARE mirror the documented root
      # install and keep it from rebuilding the SDK built above.
      - name: Install root deps (provides ts-node for the jest config)
        env:
          SKIP_SDK_PREPARE: '1'
        run: npm install --ignore-scripts --no-audit --no-fund

      # Every door the backend type-checks or tests, installed by DERIVING
      # the list rather than writing it down.
      #
      # It used to be three hardcoded steps, and the history of this file is
      # the cost of that: grandmaster, then livechat, then "same missing
      # install, four more doors" for the 40-column suites, and then main
      # went red again the day ncurses-pong and phreakwars arrived -
      # "Cannot find module '@amiexpress/bbs-door-sdk'" from a door nobody
      # had added here. A list that has to be edited every time a door is
      # written is a list that will be out of date again.
      #
      # The rule: a door referenced from web/backend's sources or tests, that
      # has a package.json depending on the SDK, gets installed. That covers
      # every door the two type-check steps below can reach, and it is a
      # superset of the six names that used to be here.
      - name: Install door deps (every door that depends on the SDK)
        run: |
          for pkg in Doors/*/package.json; do
            grep -q "bbs-door-sdk" "$pkg" || continue
            door=$(dirname "$pkg")
            echo "  installing $door"
            npm install --prefix "$door" --ignore-scripts --no-audit --no-fund
          done

      - name: Type-check
        working-directory: web/backend
        run: npx tsc --noEmit

      - name: Type-check tests
        working-directory: web/backend
        run: npm run typecheck:tests

      - name: Jest
        working-directory: web/backend
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npx jest --config dev-scripts/jest.config.ts --rootDir . --ci

  # The admin web UI type-checks nowhere else.
  #
  # Nine errors sat on main from 2026-09-04 to 2026-09-06 - a form registering
  # six Pushover/Gotify/ntfy fields the config interface never declared, an
  # API type missing the `defaultMinLevel` the roles page reads off it, two
  # dead imports - because no workflow ever ran tsc over web/config-app. The
  # backend job's two type-check steps cover web/backend only.
  config-app-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/config-app/package-lock.json

      - name: Install config-app deps
        working-directory: web/config-app
        run: npm ci --no-audit --no-fund

      - name: Type-check
        working-directory: web/config-app
        run: npx tsc --noEmit

  # The DoorRepo reference door is plain C89 with no dependencies beyond a
  # host compiler, so its suite costs seconds. It is the only thing guarding
  # the door's security predicates (shell-safety allowlist, archive-name
  # path-traversal check) and its HTTP/list.txt parsers.
  doorrepo-c-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build and run the DoorRepo C suite
        working-directory: examples/doorrepo-c
        run: make test
